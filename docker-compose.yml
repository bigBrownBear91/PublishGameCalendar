services:

  app:
    build:
      context: .
      dockerfile: PublishGameCalendar/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AWS__Region=eu-west-1
      - Jwt__Key=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARS
      - Jwt__Issuer=GameCalendar
      - Jwt__Audience=GameCalendar
      - Admin__Username=CHANGE_ME
      - Admin__Password=CHANGE_ME
      - IcsFilesPath=/data/ics
    volumes:
      - ics-data:/data/ics

volumes:
  ics-data:
