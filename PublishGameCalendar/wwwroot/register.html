<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register – Game Calendar</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav>
    <span class="brand">Game Calendar</span>
    <ul>
        <li><a href="index.html">Series</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html" class="active">Register</a></li>
    </ul>
</nav>

<main>
    <div class="form-wrap">
        <h1>Create Account</h1>

        <div id="error-msg" style="display:none;background:#fde8e8;color:#c0392b;padding:.6rem .9rem;border-radius:5px;font-size:.85rem;margin-bottom:1rem;"></div>
        <div id="success-msg" style="display:none;background:#d9f0e8;color:#1d6b44;padding:.6rem .9rem;border-radius:5px;font-size:.85rem;margin-bottom:1rem;">
            Account created! <a href="login.html">Login now</a>.
        </div>

        <form id="register-form" novalidate>
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters" required />
            </div>
            <div class="form-group">
                <label for="confirm">Confirm password</label>
                <input type="password" id="confirm" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn btn-primary" id="submit-btn">Create Account</button>
        </form>

        <p class="form-link">Already have an account? <a href="login.html">Login</a></p>
    </div>
</main>

<script src="js/api.js"></script>
<script>
    if (currentUser()) window.location.href = 'dashboard.html';

    document.getElementById('register-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const err = document.getElementById('error-msg');
        const ok  = document.getElementById('success-msg');
        const btn = document.getElementById('submit-btn');
        err.style.display = 'none';
        ok.style.display  = 'none';

        if (document.getElementById('password').value !== document.getElementById('confirm').value) {
            err.textContent = 'Passwords do not match.';
            err.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating account…';

        const res = await apiFetch('/api/auth/register', {
            method: 'POST',
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            }),
        });

        if (res.ok) {
            ok.style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
        } else {
            const errors = await res.json().catch(() => ['Registration failed.']);
            err.textContent = Array.isArray(errors) ? errors.join(' ') : 'Registration failed.';
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    });
</script>

</body>
</html>
